; generic template

[profile]
name = generic (based off DngCreator)
description = fallback metadata repair for Android DngCreator output
enabled = yes
priority = 0

; fildcards * and ? are supported.  an empty value or * matches anything
; a profile with no [match] values is a generic fallback
[match]
make = *
model = *
unique_model = *

[fixes]
; replace noninvertible CameraCalibration1/2 matrices with the identity
calibration = yes
; swap CalibrationIlluminant1/2 (and their matrix pairs) into low -> high CCT order
illuminants = yes
; raise DNGBackwardVersion to the features actually used by the file
version = yes
; reread the repaired copy and reject it if any fix is still needed
verify = yes

[calibration]
; determinant threshold used to decide whether a matrix is singular
singular_tolerance = 1e-6
; Only "identity" is currently supported.
replacement = identity

[illuminants]
; abort the swap if one half of a matrix pair is missing or shapes differ
require_pairs = yes
; refuse to swap illuminants when ProfileHueSatMap tags are present
skip_huesatmap = yes

[version]
; minimum backward version to declare
minimum = 1.1.0.0
; needed when any OpcodeList tag is present
opcode = 1.3.0.0
; needed when ForwardMatrix1/2 is present
forward_matrix = 1.2.0.0
use_opcode_list = yes
use_forward_matrix = yes

[output]
suffix = _fixed
overwrite = no
; keep the copy even when no repairs were necessary
keep_unmodified = no
max_file_mb = 4096
